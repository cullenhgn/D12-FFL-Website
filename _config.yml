title: The League HQ
description: >-
  Home of our fantasy football keeper league — draft pick trades,
  historical records, and league news.
baseurl: "" # sub-path if you use username.github.io/reponame, e.g. "/ff-league-site"
url: "" # your full site URL once live, e.g. "https://yourusername.github.io"

# League info — edit these
league_name: "The League"
league_founded: 2015
espn_league_id: "" # optional, put your ESPN league id here for reference links

# Future draft pick board — edit these each year
draft_year: 2026
draft_rounds: 18
trade_house_rule: >-
  Only picks for the 2026 draft can be traded — no trading two years out.
  When it's time to draft, whoever's name sits in a slot below picks in
  that slot.

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .bundle
